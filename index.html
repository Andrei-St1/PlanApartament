<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Plan 3D – Ap. 3, Str. Pârâului 15, Brașov</title>
<style>
  :root{--bg:#f5f3ee;--ink:#1f2328;--mut:#6b7079;--line:#dcd8cf;--card:#fff;--acc:#d9641e;--sw:#2b6cb0;--tx:#7b3fb3;--sel:#f2b705}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #top{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:5}
  #top h1{font-size:14px;margin:0 6px 0 0;font-weight:650;white-space:nowrap}
  #top .sub{color:var(--mut);font-size:12px;margin-right:auto;white-space:nowrap}
  button,select,input{font:inherit;color:inherit}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 10px;cursor:pointer;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.dang{color:#b42318;border-color:#f1c4bf}
  select.btn{padding-right:6px}
  #stage{position:relative;flex:1;min-height:0;overflow:hidden}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(31,35,40,.86);color:#fff;padding:6px 12px;border-radius:20px;font-size:12.5px;pointer-events:none;max-width:92%;text-align:center;transition:opacity .3s}
  #legend{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:11.5px;color:var(--mut)}
  #legend b{color:var(--ink)}
  #legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  #tools{background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}
  .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .row+.row{margin-top:7px}
  .mode{flex:1;min-width:68px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;font-size:12px}
  .mode .ic{font-size:18px;line-height:1}
  .chip{border:1px solid var(--line);background:#faf9f6;border-radius:20px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .chip.sw.on{background:var(--sw);border-color:var(--sw)}
  .chip.hm.on{background:var(--ink);border-color:var(--ink)}
  .lbl{font-size:12px;color:var(--mut);align-self:center;white-space:nowrap}
  /* sheet */
  #sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.12);padding:12px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;z-index:20;max-width:560px;margin:0 auto}
  #sheet:not(.open){pointer-events:none;visibility:hidden}
  #sheet.open{transform:none}
  #sheet h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
  #sheet h2 .room{font-weight:400;color:var(--mut);font-size:13px}
  .f{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;margin:8px 0}
  .f label{color:var(--mut);font-size:13px}
  .f input,.f select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
  .hgt{display:flex;gap:6px;align-items:center}
  .hgt input{width:90px;text-align:center;font-weight:650;font-size:16px}
  .hgt .btn{padding:7px 12px;font-weight:700}
  .presets{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .presets .chip{padding:3px 9px;font-size:12px}
  .acts{display:flex;gap:8px;margin-top:12px}
  .acts .btn{flex:1}
  /* modal */
  #modal{position:fixed;inset:0;background:rgba(20,22,26,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
  #modal.open{display:flex}
  #mbox{background:var(--card);width:100%;max-width:640px;max-height:86vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
  #mhead{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
  #mhead h3{margin:0;font-size:15px;margin-right:auto}
  #mbody{overflow:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #eee}
  th{color:var(--mut);font-weight:600;font-size:12px}
  td.h{font-weight:650;white-space:nowrap}
  tr.click{cursor:pointer}
  tr.grp td{background:#f6f4ef;font-weight:650;font-size:12.5px}
  .tag{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
  textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:9px;padding:8px;font:12px ui-monospace,Menlo,monospace}
  .menu .btn{display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 12px}
  .note{color:var(--mut);font-size:12.5px;margin:6px 0 12px}
  #toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:#1f2328;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:40;display:flex;gap:12px;align-items:center}
  #toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  #toast button{background:none;border:none;color:var(--sel);font-weight:700;padding:0;cursor:pointer}
  #rcard{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px;display:none;gap:8px;align-items:center;z-index:4;max-width:calc(100% - 20px)}
  #rcard.show{display:flex}
  #rcard .sw{display:flex;gap:3px}
  #rcard .sw i{width:9px;height:9px;border-radius:2px;display:block}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink);margin:6px 0}
  .chk input{width:18px;height:18px;margin:0;flex:none}
  .set{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
  .rules li{margin:4px 0;font-size:13px}
  .src a{color:var(--sw);font-size:12.5px;word-break:break-all}
  h4{margin:16px 0 6px;font-size:13.5px}
  #joy{position:absolute;right:14px;bottom:14px;width:118px;height:118px;border-radius:50%;background:rgba(31,35,40,.18);border:2px solid rgba(255,255,255,.7);display:none;touch-action:none;z-index:6}
  #joy.show{display:block}
  #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(31,35,40,.75);border:2px solid #fff;pointer-events:none}
  #joy span{position:absolute;left:0;right:0;top:-22px;text-align:center;font-size:11px;color:#1f2328;font-weight:600;text-shadow:0 0 3px #fff}
  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--mut);font-size:15px;z-index:3;background:var(--bg);line-height:1.5}
  #boot.err{color:#b42318}
  #shot{max-width:100%;border-radius:8px;border:1px solid var(--line)}
  @media (max-width:600px){#top .sub{display:none} #legend{display:none} #top h1{font-size:13px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>Ap. 3 · Str. Pârâului 15</h1><span class="sub">Su 65,0 m² · pereți 2,40 m</span>
    <button class="btn on" data-view="3d">3D</button>
    <button class="btn" data-view="top">Sus</button>
    <select class="btn" id="roomSel"><option value="">🚶 Intră în cameră…</option></select>
    <button class="btn" id="routeBtn">⚡ Trasee</button>
    <button class="btn" id="listBtn">Listă</button>
    <button class="btn" id="moreBtn">⋯</button>
  </div>
  <div id="stage">
    <div id="boot">Se încarcă planul 3D…</div>
    <div id="hint">Rotește cu un deget · zoom cu două degete</div>
    <div id="legend"><div><i style="background:#d9641e"></i><b>Prize</b> <span id="cntP">0</span></div><div><i style="background:#2b6cb0"></i><b>Întrerupătoare</b> <span id="cntS">0</span></div><div><i style="background:#7b3fb3"></i><b>Note</b> <span id="cntT">0</span></div><div><i style="background:#c0392b"></i><b>Tablou</b> <span id="cntB">–</span></div></div>
    <div id="joy"><span>mergi</span><div id="knob"></div></div>
    <div id="rcard"><span class="sw" id="rcSw"></span><span id="rcTxt"></span><button class="btn" id="rcMore" style="padding:4px 9px">Detalii</button></div>
    <div id="sheet">
      <h2><span id="shTitle">Element</span><span class="room" id="shRoom"></span></h2>
      <div class="f"><label>Tip</label><select id="shType"></select></div>
      <div class="f"><label>Înălțime</label>
        <div><div class="hgt"><button class="btn" id="hMinus">−</button><input id="shH" type="number" inputmode="numeric" step="1" min="3" max="237"><span class="lbl">cm de la pardoseală</span><button class="btn" id="hPlus">+</button></div>
        <div class="presets" id="presets"></div></div>
      </div>
      <div class="f"><label>Text</label><input id="shText" type="text" placeholder="ex: frigider, TV, aplică pat…" maxlength="60"></div>
      <label class="chk" id="dedRow"><input type="checkbox" id="shDed"><span>Circuit separat – aparat peste 2 kW (cuptor, plită, mașină de spălat, boiler, AC)</span></label>
      <div class="acts">
        <button class="btn" id="shMove">↔ Mută</button>
        <button class="btn" id="shDup">⧉ Copiază</button>
        <button class="btn dang" id="shDel">Șterge</button>
        <button class="btn on" id="shDone">Gata</button>
      </div>
    </div>
  </div>
  <div id="tools">
    <div class="row" id="modes">
      <button class="btn mode on" data-mode="nav"><span class="ic">✋</span>Navighează</button>
      <button class="btn mode" data-mode="socket"><span class="ic">🔌</span>Priză</button>
      <button class="btn mode" data-mode="switch"><span class="ic">💡</span>Întrerupător</button>
      <button class="btn mode" data-mode="text"><span class="ic">✏️</span>Text</button>
      <button class="btn mode" data-mode="panel"><span class="ic">🗄️</span>Tablou</button>
    </div>
    <div class="row" id="subRow" style="display:none"></div>
    <div class="row" id="hRow" style="display:none">
      <span class="lbl">Înălțime la plasare:</span>
      <button class="chip hm on" data-hm="tap">unde atingi</button>
      <button class="chip hm" data-hm="std" id="stdChip">standard</button>
    </div>
  </div>
</div>
<div id="modal"><div id="mbox"><div id="mhead"><h3 id="mTitle"></h3><button class="btn" id="mClose">Închide</button></div><div id="mbody"></div></div></div>
<div id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script>
/* diagnostic + compatibilitate pentru browsere mai vechi */
(function(){
  if(!CanvasRenderingContext2D.prototype.roundRect){

  window.__bootErr=show;
  addEventListener('error',e=>{ if(window.__booted) return; show('<b>Planul nu s-a putut porni.</b><br>'+(e.message||'Eroare la pornire.')+'<br><br>Reîncarcă pagina; dacă tot nu merge, încearcă alt browser.');},true);

})();
</script>
